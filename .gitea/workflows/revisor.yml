name: filantropia-solar-revisor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  revisor-qa:
    name: Revisor QA Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://127.0.0.1:3000

      - name: Set up Python venv
        run: python3 -m venv .revisor-venv

      - name: Install dev tooling
        run: |
          .revisor-venv/bin/pip install --quiet --upgrade pip
          .revisor-venv/bin/pip install --quiet ruff mypy bandit pytest pytest-cov pytest-asyncio
          .revisor-venv/bin/pip install --quiet -e ".[dev]" 2>/dev/null || \
            .revisor-venv/bin/pip install --quiet -r requirements.txt 2>/dev/null || true

      - name: Lint (ruff)
        id: lint
        continue-on-error: true
        run: |
          .revisor-venv/bin/ruff check src tests 2>&1 | tee /tmp/revisor_lint.txt
          exit ${PIPESTATUS[0]}

      - name: Type check (mypy)
        id: typecheck
        continue-on-error: true
        run: |
          .revisor-venv/bin/python -m mypy src --ignore-missing-imports 2>&1 | tee /tmp/revisor_mypy.txt
          exit ${PIPESTATUS[0]}

      - name: Unit tests (pytest)
        id: tests
        continue-on-error: true
        run: |
          .revisor-venv/bin/python -m pytest -q tests/ 2>&1 | tee /tmp/revisor_tests.txt
          exit ${PIPESTATUS[0]}

      - name: Security static analysis (bandit)
        id: bandit
        continue-on-error: true
        run: |
          .revisor-venv/bin/bandit -q -r src -s B404,B603,B310,B105 2>&1 | tee /tmp/revisor_bandit.txt
          exit ${PIPESTATUS[0]}

      - name: Post Revisor review comment
        if: always()
        env:
          WERA_GITEA_TOKEN: ${{ secrets.WERA_GITEA_TOKEN }}
          GITEA_URL: http://127.0.0.1:3000
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
          BANDIT_RESULT: ${{ steps.bandit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          def read_tail(path, max_chars=2000):
              try:
                  text = Path(path).read_text(encoding="utf-8").strip()
                  return text[-max_chars:] if len(text) > max_chars else text
              except Exception:
                  return "(output not available)"

          def icon(o):
              return "PASS" if o == "success" else "FAIL"

          checks = [
              ("Lint (ruff)",             os.environ["LINT_RESULT"],     "/tmp/revisor_lint.txt"),
              ("Type check (mypy)",       os.environ["TYPECHECK_RESULT"],"/tmp/revisor_mypy.txt"),
              ("Unit tests (pytest)",     os.environ["TESTS_RESULT"],    "/tmp/revisor_tests.txt"),
              ("Security (bandit)",       os.environ["BANDIT_RESULT"],   "/tmp/revisor_bandit.txt"),
          ]

          all_pass   = all(o == "success" for _, o, _ in checks)
          any_failed = any(o == "failure"  for _, o, _ in checks)
          verdict = "PASS" if all_pass else ("CHANGES REQUIRED" if any_failed else "PASS WITH RISK")

          run_url = os.environ.get("RUN_URL", "")
          lines = ["## Revisor QA Audit", "", f"**QA Verdict: {verdict}**  ·  [workflow run]({run_url})", "", "| Check | Result |", "|---|---|"]
          for name, outcome, _ in checks:
              lines.append(f"| {name} | {icon(outcome)} |")
          failing = [(n, p) for n, o, p in checks if o != "success"]
          if failing:
              lines += ["", "### Failing check output"]
              for name, path in failing:
                  lines += [f"<details><summary>{name}</summary>", "", "```", read_tail(path), "```", "</details>", ""]

          body = "\n".join(lines)
          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/", 1)
          token = os.environ.get("WERA_GITEA_TOKEN", "")
          gitea_url = os.environ["GITEA_URL"]
          pr_number = os.environ["PR_NUMBER"]

          if not token:
              print("WERA_GITEA_TOKEN not set; skipping")
          else:
              url = f"{gitea_url}/api/v1/repos/{owner}/{repo_name}/issues/{pr_number}/comments"
              req = urllib.request.Request(url, data=json.dumps({"body": body}).encode("utf-8"),
                  headers={"Authorization": f"token {token}", "Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f"Revisor comment posted: HTTP {resp.status} | Verdict: {verdict}")
              except Exception as exc:
                  print(f"Failed to post review comment: {exc}")
          PY
