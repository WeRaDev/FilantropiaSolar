[Application]
name=FilantropiaSolar
version=1.2.1
icon=icons/app.ico
publisher=FilantropiaSolar

[Python]
version=3.11.0
bitness=64
include_msvcrt=true

[Include]
packages =
    filantropia_solar
pypi_wheels =
    pandas==2.2.0
    numpy==2.0.0
    scipy==1.13.0
    scikit_learn==1.5.0
    joblib==1.4.0
    matplotlib==3.9.0
    seaborn==0.13.0
    openpyxl==3.1.0
    requests==2.32.0
    python_dateutil==2.9.0.post0
    pytz==2024.2
    tkcalendar==1.6.0
    Pillow==10.3.0
files =
    main.py
    Data
    weather_files
    average_values.csv

[EntryPoints]
# Creates FilantropiaSolar.exe GUI launcher and Start Menu shortcut
# Keep the name without spaces for a clean executable name
# Maps to main:main (main.py in project root)
gui_scripts =
    FilantropiaSolar = main:main

[Build]
directory=build/nsist
installer_name=FilantropiaSolar-1.2.1.exe
