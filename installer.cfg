[Application]
name=FilantropiaSolar
version=1.2.1
icon=icons/app.ico
publisher=FilantropiaSolar

[Python]
version=3.11.0
bitness=64
include_msvcrt=true

[Include]
packages =
    filantropia_solar
py_modules =
    main
files =
    Data
    weather_files
    average_values.csv

[EntryPoints]
# Creates FilantropiaSolar.exe GUI launcher and Start Menu shortcut
# Keep the name without spaces for a clean executable name
# Maps to main:main (main.py in project root)
gui_scripts =
    FilantropiaSolar = main:main

[Build]
directory=build/nsist
installer_name=FilantropiaSolar-1.2.1.exe
