schema_version: 1
upstream_commit: d842a1bb34a42e9d7c0d54a1b12ead9e0e59e283
controls:
  - {id: DIS-01, owner_role: project-owner, enforcement: admission-registry, test_method: reject duplicate or unknown agent/deployment identifiers, evidence: reconciled authoritative agent records}
  - {id: DIS-02, owner_role: business-owner, enforcement: admission-registry, test_method: deny unnamed owners and unclassified capabilities, evidence: approved purpose and risk/profile review}
  - {id: DIS-03, owner_role: policy-owner, enforcement: decision-history, test_method: reject expired exceptions and preserve retired records, evidence: versioned approvals exceptions and retirement history}
  - {id: DIS-04, owner_role: platform-owner, enforcement: component-admission, test_method: detect missing or altered instructions skills models tools and MCP definitions, evidence: approved component identities sources versions and owners}
  - {id: DIS-05, owner_role: platform-owner, enforcement: composition-reconciliation, test_method: seed a changed component and identify all dependent runs, evidence: approved and observed composition/delegation graph}
  - {id: DIS-06, owner_role: identity-owner, enforcement: credential-connector, test_method: compare intended grants with actual downstream access, evidence: effective identity credential-reference resource and action mapping}
  - {id: DIS-07, owner_role: security-owner, enforcement: discovery-reconciliation, test_method: seed unknown local and runtime components and route discrepancies, evidence: scheduled discovery findings with accountable resolution}
  - {id: CON-01, owner_role: platform-owner, enforcement: load-launch-release-admission, test_method: deny unapproved changed unvalidated or quarantined versions, evidence: exact-release validation and runtime admission receipts}
  - {id: CON-02, owner_role: security-owner, enforcement: capability-path-policy, test_method: exercise untrusted input plus sensitive access plus external communication and indirect tool paths, evidence: composition risk decisions and denied paths}
  - {id: CON-03, owner_role: platform-owner, enforcement: sandbox-and-network, test_method: deny host sibling credential socket private-network and resource-limit escapes, evidence: deployed negative confinement tests}
  - {id: CON-04, owner_role: policy-owner, enforcement: trusted-profile-assignment, test_method: deny agent-selected or self-edited capability profiles, evidence: versioned authenticated bounded profile and assignment}
  - {id: AUT-01, owner_role: identity-owner, enforcement: authenticated-workload-context, test_method: reject agent spoofing and join WARP forge actions to distinct run/principal identities, evidence: attributed agent deployment requester purpose task target and time}
  - {id: AUT-02, owner_role: identity-owner, enforcement: task-policy-decision, test_method: deny out-of-task target action tenant data and expiry requests, evidence: trusted bounded grant and target decision}
  - {id: AUT-03, owner_role: identity-owner, enforcement: delegation-intersection, test_method: reject child scope escalation and lost originating context, evidence: parent-child grant chain}
  - {id: AUT-04, owner_role: identity-owner, enforcement: just-in-time-connector, test_method: verify sandbox context files environment logs and package hooks cannot obtain reusable credentials, evidence: short-lived action permits and connector credential-isolation tests}
  - {id: AUT-05, owner_role: business-owner, enforcement: independent-action-approval, test_method: deny self-issued forged replayed stale wrong-parameter and insufficient-approver approvals, evidence: independently authenticated exact-action approval receipts}
  - {id: AUT-06, owner_role: platform-owner, enforcement: fail-closed-action-gate, test_method: deny material actions during identity policy approval target-state or evidence outages, evidence: dependency-failure and circuit-breaker tests}
  - {id: AUT-07, owner_role: identity-owner, enforcement: human-step-up, test_method: require renewed authenticated consent at defined high-risk threshold, evidence: action-bound step-up assurance record}
  - {id: AUT-08, owner_role: policy-owner, enforcement: independent-elevation, test_method: deny self-elevation and reuse after expiry or for another task, evidence: scoped temporary elevation with justification approver and expiry}
  - {id: AUT-09, owner_role: identity-owner, enforcement: holder-bound-workload-permit, test_method: replay a permit from another workload/key and verify denial, evidence: sender-constrained authentication and documented downstream limitations}
  - {id: OBS-01, owner_role: evidence-owner, enforcement: independent-event-writers, test_method: record requested denied started successful failed cancelled and unknown actions, evidence: agent-native action and outcome event coverage}
  - {id: OBS-02, owner_role: evidence-owner, enforcement: trusted-correlation, test_method: reconstruct a task across gateway inference source-control and target events, evidence: complete shared run/task/trace chain}
  - {id: OBS-03, owner_role: security-owner, enforcement: runtime-drift-monitor, test_method: seed excess destinations denials resource use budget breaches and scope growth, evidence: alerts and bounded response to behavior drift}
  - {id: OBS-04, owner_role: business-owner, enforcement: intent-aware-output-checks, test_method: catch secret commits wrong recipients wrong tenants and permitted-but-harmful actions, evidence: independently checked unintended-action findings}
  - {id: OBS-05, owner_role: evidence-owner, enforcement: intent-to-outcome-join, test_method: link business intent approval executed action and target receipt, evidence: end-to-end task outcome record}
  - {id: OBS-06, owner_role: evidence-owner, enforcement: protected-complete-evidence, test_method: detect missing concurrent or tampered events and test retention access redaction deletion and legal hold, evidence: independently verified checkpoints sequence coverage and privacy controls}
  - {id: VAL-01, owner_role: security-owner, enforcement: deployed-agent-evaluation, test_method: adversarial documents prompts tool results delegation and wrong-target scenarios after material changes, evidence: configuration-specific evaluation results and thresholds}
  - {id: VAL-02, owner_role: project-owner, enforcement: component-test-gate, test_method: test skill handler MCP instruction schema privilege and unsafe-input changes, evidence: first-party releasable component security tests}
  - {id: VAL-03, owner_role: project-owner, enforcement: project-native-quality-gates, test_method: fail tests lint types secrets dependency and licensing checks for generated artifacts, evidence: exact-artifact test and release receipts}
  - {id: VAL-04, owner_role: business-owner, enforcement: independent-outcome-check, test_method: validate recipient tenant amount environment source fidelity and final target result, evidence: pre-finalization checks for irreversible actions and post-action validation}
  - {id: RES-01, owner_role: incident-owner, enforcement: scheduler-stop-and-grant-revocation, test_method: stop active work reject queued jobs and revoke downstream sessions within agreed harm bound, evidence: timed stop and revocation drill}
  - {id: RES-02, owner_role: incident-owner, enforcement: fleet-component-quarantine, test_method: quarantine a version and deny its queued deployed and reloaded uses, evidence: affected composition query and admission denial records}
  - {id: RES-03, owner_role: incident-owner, enforcement: evidence-preservation-and-impact-query, test_method: reconstruct affected runs resources records and dependencies before cleanup, evidence: protected incident snapshot and impact report}
  - {id: RES-04, owner_role: business-owner, enforcement: non-agent-fallback, test_method: rehearse essential workflows without agents or unverified high-impact actions, evidence: approved manual or deterministic continuity exercise}
  - {id: RES-05, owner_role: security-owner, enforcement: integrity-recheck-at-load, test_method: change skill code instructions tool schema endpoint permissions or integrity reference and deny reuse, evidence: rug-pull regression and reapproval history}
