# TRL5 (wera-ss-pt-tv-1) overrides
# FilantropiaSolar app SoT is Nextcloud AIO (not filantropia-nextcloud).
# Boot: systemd filantropia-stack.service -> scripts/trl5-ensure-stack.sh
services:
  nextcloud:
    ports: !override
      - "127.0.0.1:18080:80"
      - "100.82.252.18:18080:80"
    environment:
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost filantropia-nextcloud 127.0.0.1 filantropiasolar.pt www.filantropiasolar.pt filantropiasolar.wera.global wera-ss-pt-tv-1.tailfb390c.ts.net 100.82.252.18
    # Legacy compose NC must stay off on TRL5 after reboot.
    restart: "no"
  odoo:
    ports: !override
      - "127.0.0.1:8069:8069"
      - "100.82.252.18:8069:8069"
    environment:
      - FS_API_BASE_URL=${FS_API_BASE_URL:-http://nextcloud-aio-apache:11000/index.php/apps/filantropia_solar/api/public/v1}
      - FS_LIFECYCLE_API_BASE_URL=${FS_LIFECYCLE_API_BASE_URL:-http://nextcloud-aio-apache:11000/index.php/apps/filantropia_solar/api/lifecycle/v1}
      - FS_NC_ADMIN_URL=${FS_NC_ADMIN_URL:-https://wera-ss-pt-tv-1.tailfb390c.ts.net}
      - FS_NC_PUBLIC_ORIGIN=${FS_NC_PUBLIC_ORIGIN:-https://wera-ss-pt-tv-1.tailfb390c.ts.net}
  ml-service:
    ports: !override
      - "127.0.0.1:8501:8501"
      - "100.82.252.18:8501:8501"
