# PostgreSQL 16 primary snippets for TRL5 Odoo physical replication.
# Include from the container postgresql.conf or mount as a conf.d file.
# Do not enable on Frank while it remains a standby.

listen_addresses = '*'
wal_level = replica
max_wal_senders = 4
max_replication_slots = 4
hot_standby = on
wal_keep_size = 1024
synchronous_commit = on
# Availability-first: asynchronous streaming (no synchronous_standby_names).
