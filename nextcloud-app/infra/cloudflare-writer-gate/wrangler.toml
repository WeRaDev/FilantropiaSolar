# Repository-owned writer gate. Do not deploy without separate approval.
name = "filantropia-odoo-writer-gate"
main = "src/writer-gate.js"
compatibility_date = "2026-10-13"
workers_dev = true

# Phase C: production public traffic through writer gate (fail-closed).
# Rollback: comment these routes and redeploy; tunnel DNS remains.
routes = [
  { pattern = "filantropiasolar.pt/*", zone_name = "filantropiasolar.pt" },
  { pattern = "www.filantropiasolar.pt/*", zone_name = "filantropiasolar.pt" },
]

[durable_objects]
bindings = [{ name = "WRITER_LEASE", class_name = "WriterLeaseObject" }]

# SQLite-backed DO (current Cloudflare recommendation). Key-value storage API
# remains compatible with this.storage.get/put usage in writer-gate.js.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WriterLeaseObject"]

# Secrets (set via wrangler secret, never commit):
# LEASE_API_TOKEN, ORIGIN_SHARED_SECRET
# Origin base URLs (Phase B; hostnames may be vars or secrets):
# ORIGIN_TRL5_URL, ORIGIN_FRANK_URL

[vars]
LEASE_TTL_SECONDS = "30"
LEASE_DRAIN_SECONDS = "5"
LEASE_GRACE_SECONDS = "15"
LEASE_SOURCE_NAME = "cloudflare-durable-object-lease"
ORIGIN_FETCH_TIMEOUT_MS = "10000"
ORIGIN_TRL5_URL = "https://odoo-trl5.wera.global"
ORIGIN_FRANK_URL = "https://odoo-frank.wera.global"
