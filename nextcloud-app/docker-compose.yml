# FilantropiaSolar Development Environment
#
# Docker Compose configuration for running Nextcloud with the ML microservice.
# Use: docker compose up -d
#
# Access:
# - Nextcloud: http://localhost:8080
# - ML Service: http://localhost:8501
# - Adminer (DB): http://localhost:8081

services:
  # Nextcloud server
  nextcloud:
    image: nextcloud:28-apache
    container_name: filantropia-nextcloud
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=nextcloud_dev_password
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost filantropia-nextcloud
    volumes:
      - nextcloud_data:/var/www/html
      - ./:/var/www/html/custom_apps/filantropia_solar:ro
    depends_on:
      - db
      - redis
    networks:
      - filantropia-net
    restart: unless-stopped

  # MariaDB database
  db:
    image: mariadb:10.11
    container_name: filantropia-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_dev_password
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=nextcloud_dev_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - filantropia-net
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: filantropia-redis
    networks:
      - filantropia-net
    restart: unless-stopped

  # ML Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: filantropia-ml
    ports:
      - "8501:8501"
    environment:
      - MODEL_PATH=/app/models
      - DATA_PATH=/app/data
      - WEATHER_PATH=/app/weather_files
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ml-service:/app
      - ml_models:/app/models
      - ../data:/app/data:ro
      - ../weather_files:/app/weather_files:ro
    networks:
      - filantropia-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Adminer for database management (optional, development only)
  adminer:
    image: adminer:latest
    container_name: filantropia-adminer
    ports:
      - "8081:8080"
    networks:
      - filantropia-net
    profiles:
      - debug
    restart: unless-stopped

  # Odoo PostgreSQL (optional, odoo profile only)
  odoo-db:
    image: postgres:16-alpine
    container_name: filantropia-odoo-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_dev_password
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    networks:
      - filantropia-net
    profiles:
      - odoo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Odoo 19 public website and CRM (optional, odoo profile only)
  # Custom image bakes openupgradelib/requests for OCA queue_job (see odoo/Dockerfile).
  # Depends only on odoo-db by default. TRL5 uses AIO Nextcloud (not filantropia-nextcloud);
  # do not require the legacy NC container or Odoo will fail/restart when it is stopped.
  odoo:
    build:
      context: ./odoo
      dockerfile: Dockerfile
    image: filantropia-odoo:19.0
    container_name: filantropia-odoo
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=odoo_dev_password
      # Override on TRL5 AIO via .env.trl5 / compose.trl5 (nextcloud-aio-apache:11000).
      - FS_API_BASE_URL=${FS_API_BASE_URL:-http://filantropia-nextcloud/apps/filantropia_solar/api/public/v1}
      - FS_PUBLIC_API_TOKEN=${FS_PUBLIC_API_TOKEN:-REPLACE_ME}
      - FS_LIFECYCLE_API_BASE_URL=${FS_LIFECYCLE_API_BASE_URL:-http://filantropia-nextcloud/apps/filantropia_solar/api/lifecycle/v1}
      - FS_LIFECYCLE_API_TOKEN=${FS_LIFECYCLE_API_TOKEN:-${FS_PUBLIC_API_TOKEN:-REPLACE_ME}}
      - FS_NC_ADMIN_URL=${FS_NC_ADMIN_URL:-}
      - FS_NC_PUBLIC_ORIGIN=${FS_NC_PUBLIC_ORIGIN:-}
      - ODOO_QUEUE_JOB_CHANNELS=root:2
      - ODOO_QUEUE_JOB_PORT=8069
      - ODOO_QUEUE_JOB_HOST=localhost
      - ODOO_QUEUE_JOB_SCHEME=http
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
      - ./odoo/config/odoo.conf:/etc/odoo/odoo.conf:ro
    networks:
      - filantropia-net
    profiles:
      - odoo
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  filantropia-net:
    driver: bridge

volumes:
  nextcloud_data:
  db_data:
  ml_models:
  odoo_data:
  odoo_db_data:
