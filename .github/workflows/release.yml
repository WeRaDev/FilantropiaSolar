name: Automated Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write
  id-token: write

jobs:
  # ============================================
  # Pre-release validation
  # ============================================
  validate:
    name: Pre-release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Releasing version: $VERSION"
        
    - name: Validate version format
      run: |
        if [[ ! "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format: ${{ steps.version.outputs.version }}"
          echo "Expected format: X.Y.Z (e.g., 1.0.0)"
          exit 1
        fi
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev-simple.txt
        
    - name: Run pre-release tests
      run: |
        pytest tests/unit/ -v --tb=short
        
    - name: Validate package can be built
      run: |
        pip install build
        python -m build
        
    - name: Check built package
      run: |
        pip install twine
        twine check dist/*

  # ============================================
  # Create GitHub Release
  # ============================================
  github-release:
    name: GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    
    - name: Generate SBOM (SPDX)
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: spdx-json
        output-file: sbom.spdx.json
        
    - name: Generate release notes
      id: release_notes
      run: |
        echo "## 🚀 FilantropiaSolar v${{ needs.validate.outputs.version }}" > release_notes.md
        echo "" >> release_notes.md
        echo "### 🎯 What's New" >> release_notes.md
        echo "" >> release_notes.md
        
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ ! -z "$LAST_TAG" ]; then
          echo "### 📋 Changes since $LAST_TAG:" >> release_notes.md
          git log --pretty=format:"- %s" $LAST_TAG..HEAD >> release_notes.md
        else
          echo "- Initial release of FilantropiaSolar" >> release_notes.md
        fi
        
        echo "" >> release_notes.md
        echo "### 📦 Installation" >> release_notes.md
        echo "" >> release_notes.md
        echo "\`\`\`bash" >> release_notes.md
        echo "pip install filantropia-solar==${{ needs.validate.outputs.version }}" >> release_notes.md
        echo "\`\`\`" >> release_notes.md
        echo "" >> release_notes.md
        echo "### 🔗 Links" >> release_notes.md
        echo "- [📖 Documentation](https://github.com/WeRaDev/FilantropiaSolar)" >> release_notes.md
        echo "- [🐛 Report Issues](https://github.com/WeRaDev/FilantropiaSolar/issues)" >> release_notes.md
        echo "- [💡 Feature Requests](https://github.com/WeRaDev/FilantropiaSolar/issues)" >> release_notes.md
        
        cat release_notes.md
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.validate.outputs.version }}
        name: FilantropiaSolar v${{ needs.validate.outputs.version }}
        body_path: release_notes.md
        files: |
          dist/*.tar.gz
          dist/*.whl
          sbom.spdx.json
        draft: false
        prerelease: false
        make_latest: true
        generate_release_notes: true


  # ============================================
  # Update Documentation
  # ============================================
  docs-release:
    name: Update Documentation
    needs: [validate, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material
        
    - name: Build documentation
      run: |
        mkdocs build
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        publish_branch: gh-pages
        cname: filantropia-solar.weradev.com
      continue-on-error: true  # Don't fail if Pages not configured

  # ============================================
  # Post-release notifications
  # ============================================
  notify:
    name: Post-release Notifications
    needs: [validate, github-release, docs-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    
    steps:
    - name: Release Summary
      run: |
        echo "## 🎉 Release Summary"
        echo "Version: v${{ needs.validate.outputs.version }}"
        echo "GitHub Release: ${{ needs.github-release.result }}"
        echo "Documentation: ${{ needs.docs-release.result }}"
        
        if [ "${{ needs.github-release.result }}" = "success" ]; then
          echo ""
          echo "✅ GitHub Release created:"
          echo "   https://github.com/WeRaDev/FilantropiaSolar/releases/tag/v${{ needs.validate.outputs.version }}"
        fi
